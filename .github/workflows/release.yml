# TP12 partie 5 : publication signée de contact-api dans GHCR.
# Déclenché par un tag vX.Y.Z : build -> push -> SBOM -> signature Cosign keyless -> provenance SLSA -> release GitHub.
name: release

on:
  push:
    tags: ["v*.*.*"]

# Aucun droit par défaut : chaque job ne reçoit que ce dont il a besoin (TP10).
permissions: {}

env:
  # Nom en minuscules imposé par les registres OCI ; le dépôt GitHub s'appelle devops-partie4.
  IMAGE: ghcr.io/amal356/contact-api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # créer la release GitHub et y attacher le SBOM
      packages: write      # pousser l'image dans ghcr.io
      id-token: write      # jeton OIDC : signature Cosign keyless + attestation de provenance
      attestations: write  # enregistrer l'attestation dans GitHub
    steps:
      # Toutes les actions sont épinglées par SHA complet (le commentaire donne la version).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # jeton éphémère du workflow, aucun secret stocké

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # SBOM SPDX de l'image publiée (référencée par son digest, jamais par son tag).
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Signature keyless : jeton OIDC GitHub -> certificat éphémère Fulcio -> signature inscrite dans Rekor.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Signer l'image (Cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attacher le SBOM comme attestation signée (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      # Provenance SLSA (in-toto) signée par GitHub, publiée dans le registre et dans l'onglet Attestations.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Release GitHub avec le SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" sbom.spdx.json \
            --title "contact-api $GITHUB_REF_NAME" \
            --notes "Image : ${IMAGE}@${DIGEST} (signée avec Cosign keyless, provenance SLSA attestée). SBOM SPDX joint."
